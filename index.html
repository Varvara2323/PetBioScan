<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PetBioScan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-width app column, sticky top bar, bottom tab bar; views swap by #hash (QR deep links). */
:root{
  --bg:#F2F4FB; --surface:#FFFFFF; --surface-2:#E8EBF8; --ink:#121838; --muted:#566086; --line:#D9DEF0;
  --accent:#2B3CE0; --accent-ink:#FFFFFF; --accent-soft:#E2E5FF;
  --r:#E0444B; --r-soft:#FDE5E6; --s:#0E9F64; --s-soft:#DDF5EA; --warn:#C77A00; --warn-soft:#FFF1D6;
  --shadow:0 1px 2px rgba(18,24,56,.06),0 6px 20px rgba(18,24,56,.06);
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0F21; --surface:#161A33; --surface-2:#1F2445; --ink:#E9ECFA; --muted:#9DA5CC; --line:#2B3156;
  --accent:#7684FF; --accent-ink:#0C0F21; --accent-soft:#232A5E;
  --r:#FF6A70; --r-soft:#3A1C24; --s:#36D093; --s-soft:#123527; --warn:#FFBE4A; --warn-soft:#3A2C10;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0F21; --surface:#161A33; --surface-2:#1F2445; --ink:#E9ECFA; --muted:#9DA5CC; --line:#2B3156;
  --accent:#7684FF; --accent-ink:#0C0F21; --accent-soft:#232A5E;
  --r:#FF6A70; --r-soft:#3A1C24; --s:#36D093; --s-soft:#123527; --warn:#FFBE4A; --warn-soft:#3A2C10;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.02em}
.back{border:0;background:var(--surface);box-shadow:var(--shadow);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.sos-mini{margin-left:auto;border:0;background:var(--r);color:#fff;font-weight:700;font-size:13px;padding:8px 12px;border-radius:999px}
main{flex:1;padding-block:4px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2;letter-spacing:-.015em}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;line-height:1.25}
h3{font-size:15px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--r);color:#fff}
.btn.block{width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.pill.r{background:var(--r-soft);color:var(--r)} .pill.s{background:var(--s-soft);color:var(--s)} .pill.w{background:var(--warn-soft);color:var(--warn)}
.alert{border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.alert.r{background:var(--r-soft)} .alert.w{background:var(--warn-soft)} .alert.s{background:var(--s-soft)} .alert.a{background:var(--accent-soft)}
.alert b.t{display:block;margin-bottom:2px}
.alert .ic{flex:none;width:22px;height:22px;margin-top:2px}
.alert.r .ic{color:var(--r)} .alert.w .ic{color:var(--warn)} .alert.s .ic{color:var(--s)} .alert.a .ic{color:var(--accent)}

/* Home */
.hero-banner{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-decoration:none}
.hero-banner .big{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1}
.hero-banner p{font-size:14px;line-height:1.35}
.hero-banner span.go{display:inline-block;margin-top:6px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.sos{border:0;width:100%;background:var(--r);color:#fff;border-radius:20px;padding:18px;text-align:left;display:flex;gap:14px;align-items:center}
.sos .sos-ic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.sos b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block}
.sos span{font-size:13px;opacity:.92}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:8px;min-height:112px}
.tile .ti{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tile b{font-size:14px;line-height:1.25}
.tile span{font-size:12px;color:var(--muted);line-height:1.3}

/* Wizard */
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.wiz-nav{display:flex;gap:10px}
.wiz-nav .btn{flex:1}
.level{border-radius:18px;padding:18px;color:#fff;display:flex;flex-direction:column;gap:6px}
.level.l4{background:#B3141B} .level.l3{background:var(--r)} .level.l2{background:#D67A00} .level.l1{background:var(--s)}
.level .lt{font-family:var(--f-display);font-size:20px;font-weight:700}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}

/* Timer + checklist */
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2);border:0;text-align:left;width:100%}
.check .cb{width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;margin-top:1px}
.check[aria-pressed="true"]{opacity:.65}
.check[aria-pressed="true"] .cb{background:var(--s);border-color:var(--s);color:#fff}
.check[aria-pressed="true"] .ct{text-decoration:line-through}
.check .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.timer-wrap{display:grid;place-items:center;position:relative}
.timer-wrap svg{width:min(260px,70vw);height:auto}
.timer-read{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.timer-read .tt{font-family:var(--f-mono);font-weight:700;font-size:44px}
details{background:var(--surface-2);border-radius:12px;padding:12px}
summary{font-weight:700;cursor:pointer}

/* Scanner */
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
.search input:focus{border-color:var(--accent);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:118px 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar-row i{font-style:italic}
.bar-row .cell{height:24px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-family:var(--f-mono);font-size:12px;font-weight:700}
.cell.R{background:var(--r-soft);color:var(--r)} .cell.S{background:var(--s-soft);color:var(--s)}

/* Heatmap */
.hm-scroll{overflow-x:auto;margin-inline:-4px;padding:4px}
.hm{display:grid;grid-template-columns:96px repeat(6,minmax(52px,1fr));gap:4px;min-width:420px}
.hm .h{font-size:10px;overflow-wrap:anywhere;font-weight:700;color:var(--muted);display:flex;align-items:end;justify-content:center;text-align:center;line-height:1.15;padding-bottom:4px;font-style:italic}
.hm .rl{font-size:12px;font-weight:700;display:flex;flex-direction:column;justify-content:center;line-height:1.15}
.hm .rl small{font-weight:400;color:var(--muted);font-size:10px}
.hm .c{border-radius:8px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;font-weight:700}
.hm .c small{font-size:10px;opacity:.85}
.hm .c.R{background:var(--r);color:#fff} .hm .c.S{background:var(--s);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.pie-row{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.survey-q{display:flex;flex-direction:column;gap:6px}
.stackbar{display:flex;height:26px;border-radius:8px;overflow:hidden;gap:2px}
.stackbar div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;font-family:var(--f-mono);min-width:0}

/* KB */
.bug{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-decoration:none;color:var(--ink)}
.bug-dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.danger-tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.mini-strip{display:flex;gap:3px}
.mini-strip span{width:12px;height:12px;border-radius:3px}
.mini-strip .R{background:var(--r)} .mini-strip .S{background:var(--s)}
.animals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.animals div{background:var(--surface-2);border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;line-height:1.2}
.animals div.on{background:var(--accent);color:var(--accent-ink);font-weight:700}

/* Map */
.map-wrap{position:relative;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px;overflow:hidden}
.map-wrap svg{width:100%;height:auto;display:block}
.district{cursor:pointer;transition:opacity .15s}
.district:hover{opacity:.85}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.t td.num{text-align:right;font-family:var(--f-mono)}

/* Pet */
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.field input,.field select{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notif{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:grid;grid-template-columns:36px 1fr;gap:10px}
.notif .ni{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.notif .nh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.notif p{font-size:13px;line-height:1.4}
.status-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.status-row:last-child{border-bottom:0}

/* One Health */
.oh svg{width:100%;height:auto}
.flow{stroke-dasharray:6 8;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--accent)}
nav.tabs a.sos-tab{color:var(--r)}
.foot{font-size:11px;color:var(--muted);text-align:center;line-height:1.4}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:20;max-width:90vw}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>

    <symbol id="i-pill" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="8" width="19" height="8" rx="4" transform="rotate(-45 12 12)"/><path d="m8.5 8.5 7 7" transform="translate(0 0)"/></g></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h8"/></symbol>

    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M11 10h2v8h-2zm0-4h2v2h-2z" fill="var(--surface)"/></symbol>
    <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m7 12 3.5 3.5L17 9" fill="none" stroke="var(--surface)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <symbol id="i-chart" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-quiz" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></g></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2c3 3 3 17 0 20M12 2c-3 3-3 17 0 20"/></g></symbol>
    <symbol id="i-steth" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 3v6a5 5 0 0 0 10 0V3"/><path d="M10 14v2a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="12" r="2"/></g></symbol>
    <symbol id="i-micro" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></g></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></g></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.5-2.5h-5A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5-6.7V3a2 2 0 1 0-4 0v1.3A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></symbol>
  </defs>
</svg>

<div class="app">
  <header class="topbar">
    <button class="back" id="backBtn" aria-label="Назад" hidden><svg width="20" height="20"><use href="#i-back"/></svg></button>
    <a class="brand" href="#home" id="brand">
      <span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg></span>
      <span>PetBioScan<small>Аптечка без ошибок</small></span>
    </a>
    <button class="sos-mini" id="sosMini">SOS · укус</button>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<nav class="tabs" aria-label="Разделы">
  <div class="in">

let wakeLock=null;
function startTimer(){
  if(!timerState) timerState={left:TOTAL};

}
function pauseTimer(){ timerState.running=false; clearInterval(timerState.iv); timerState.left=Math.max(0,Math.round((timerState.end-Date.now())/1000)); paintTimer(); try{wakeLock&&wakeLock.release();}catch(e){} }

function tick(){
  if(!timerState) return;
  const left = Math.max(0,Math.round((timerState.end-Date.now())/1000));
  const prev = timerState.left; timerState.left=left;
  if(prev> TOTAL-MIN && left<=TOTAL-MIN) toast("2 минуты: минимум выполнен. Продолжайте до 15 минут");
  if(left===0){ timerState.running=false; clearInterval(timerState.iv); toast("Готово! Переходите к шагу 5"); }
  paintTimer();
}
function paintTimer(){

}

  `<div class="card"><h2>Сводка для городских служб</h2><p class="small muted">Округа, отсортированные по индексу риска. Индекс = плотность выгула × 10 + дефицит урн × 8 + жалобы жителей (до 40 баллов).</p>

   ${[...DISTRICTS].sort((a,b)=>districtRisk(b,rep)-districtRisk(a,rep)).map(d=>{const r=rep[d.id]||{dirty:0,nobin:0,waste:0}; const s=districtRisk(d,rep); return `<tr><td><b>${d.n}</b></td><td class="num">${r.dirty+r.nobin+r.waste}</td><td class="num"><span class="pill ${riskLevel(s)[2]}">${s}</span></td><td class="small">${s>=65?"биологические отходы: рост риска <i>E. faecalis</i>, <i>P. mirabilis</i>":s>=45?"наблюдение":"—"}</td></tr>`;}).join("")}
   </tbody></table></div></div>
   ${alertBox("a","Пример сигнала","«В ЮВАО жители жалуются на биологические отходы на площадках выгула: растёт риск энтеробактерий и энтерококков. Рекомендуется установить урны и дезинфицировать площадки».")}`}
  <button class="btn ghost" id="mapReset">Сбросить демо-жалобы</button>
  ${DISCLAIMER}`;
  view.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ mapMode=b.dataset.m; ROUTES.map(); });
  view.querySelectorAll(".district").forEach(g=>{ const f=()=>{ mapSel=g.dataset.id; ROUTES.map(); }; g.onclick=f; g.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();f();} }; });
  view.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ const r=store.get("reports",rep); r[mapSel]=r[mapSel]||{dirty:0,nobin:0,waste:0}; r[mapSel][b.dataset.r]++; store.set("reports",r); toast("Спасибо! Отметка добавлена"); ROUTES.map(); });
  $("#mapReset").onclick=()=>{ store.set("reports",{}); ROUTES.map(); };
};

/* ================== ПРОВЕРЬ СЕБЯ ================== */
const QUIZ = [
  {id:"q1",q:"Считаете ли вы возможным заражение от домашнего животного при близком контакте?",o:[["Да",0],["Скорее да, чем нет",5],["Нет",15]],
   tip:{2:"Заражение возможно: в пасти клинически здоровых питомцев найдены синегнойная палочка, протей и энтерококк."}},
  {id:"q2",q:"Разрешаете ли вы питомцу облизывать ваше лицо или руки?",o:[["Да",25],["Нет",0]],
   tip:{0:"Вы разрешаете собаке лизать лицо. В исследовании 67% пар «бактерия — антибиотик» оказались устойчивыми: бактерии из пасти питомца часто не боятся обычных лекарств. Пожалуйста, не позволяйте этого, особенно если на губах или коже есть ранки."}},
  {id:"q3",q:"Проверяете ли вы состояние ротовой полости питомца у ветеринара?",o:[["Да, регулярно",0],["Только при необходимости",10],["Нет",20]],
   tip:{1:"Осмотр у ветеринара-стоматолога нужен не реже раза в год. Зубной камень создаёт ниши, где бактерии в 10–1000 раз менее чувствительны к антибиотикам.",2:"Осмотр у ветеринара-стоматолога нужен не реже раза в год. Зубной камень создаёт ниши, где бактерии в 10–1000 раз менее чувствительны к антибиотикам."}},
  {id:"q4",q:"Знаете ли вы о патогенных микроорганизмах, которые могут содержаться в слюне животных?",o:[["Да, хорошо осведомлён(а)",0],["Слышал(а), но знаю мало",5],["Нет, не знаю",10]],
   tip:{1:"Загляните в раздел «Кто живёт в пасти питомца?»: там 6 бактерий из исследования.",2:"Загляните в раздел «Кто живёт в пасти питомца?»: там 6 бактерий из исследования."}},
  {id:"q5",q:"Соблюдаете ли вы правила гигиены после контакта с животным (мытьё рук, обработка царапин)?",o:[["Всегда",0],["Иногда",10],["Нет",15]],
   tip:{1:"Мойте руки после общения с питомцем и перед едой. Царапины промывайте водой с мылом и обрабатывайте хлоргексидином.",2:"Мойте руки после общения с питомцем и перед едой. Царапины промывайте водой с мылом и обрабатывайте хлоргексидином."}},
  {id:"q6",q:"Давали ли вы себе или питомцу антибиотик без назначения врача?",o:[["Нет",0],["Да",15]],
   tip:{1:"Азитромицин и клиндамицин «наугад» не работают против 83–100% штаммов из исследования и помогают бактериям становиться устойчивее."}},
];
let quizA = store.get("quiz",{});
ROUTES.quiz = ()=>{
  const answered = QUIZ.filter(q=>quizA[q.id]!==undefined).length;
  if(answered===QUIZ.length) return quizResult();
  view.innerHTML = `
  <h1>Проверь себя</h1>
  <p class="muted">Вопросы из анкеты исследования, которую заполнили 35 владельцев. Ответы остаются только на этом устройстве.</p>
  <div class="progress"><i style="width:${answered/QUIZ.length*100}%"></i></div>
  ${QUIZ.map(q=>`<div class="card"><b>${q.q}</b><div class="opts">${q.o.map(([l],i)=>`<button class="opt" data-q="${q.id}" data-i="${i}" aria-pressed="${quizA[q.id]===i}"><span class="box">${quizA[q.id]===i?'<svg width="14" height="14"><use href="#i-tick"/></svg>':""}</span><span>${l}</span></button>`).join("")}</div></div>`).join("")}
  ${DISCLAIMER}`;
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ quizA[b.dataset.q]=+b.dataset.i; store.set("quiz",quizA); const y=window.scrollY; ROUTES.quiz(); window.scrollTo(0,y); });
};
function quizResult(){
  const score = QUIZ.reduce((s,q)=>s+q.o[quizA[q.id]][1],0);
  const [lbl,,cls] = score>=50?["Высокий","","r"]:score>=25?["Средний","","w"]:["Низкий","","s"];
  const tips = QUIZ.map(q=>q.tip[quizA[q.id]]).filter(Boolean);
  view.innerHTML = `
  <h1>Ваш результат</h1>
  <div class="card" style="align-items:flex-start"><span class="eyebrow">Индекс личного зоонозного риска</span><div class="row"><b class="mono" style="font-size:40px">${score}</b><span class="muted">из 100</span><span class="pill ${cls}">${lbl} риск</span></div>
  <div class="progress"><i style="width:${score}%;background:var(--${cls==="s"?"s":cls==="w"?"warn":"r"})"></i></div></div>
  ${tips.length?tips.map(t=>alertBox("w","Обратите внимание",t)).join(""):alertBox("s","Отлично","Ваши привычки снижают риск. Расскажите о них близким.")}
  <div class="card"><b>Для сравнения</b><p class="small">В опросе исследования хорошо осведомлены о зоонозных рисках только 20% владельцев, 56% знают фрагментарно, 24% не знают совсем.</p></div>
  <div class="wiz-nav"><button class="btn ghost" id="qr">Пройти заново</button><a class="btn" href="#pet">Завести дневник питомца</a></div>
  ${DISCLAIMER}`;
  $("#qr").onclick=()=>{ quizA={}; store.set("quiz",{}); ROUTES.quiz(); };
}

/* ================== ДНЕВНИК ПИТОМЦА И НАПОМИНАНИЯ ================== */
const today = ()=>new Date(new Date().toDateString());
const iso = d=>{ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const addDays=(d,n)=>new Date(d.getTime()+n*864e5);
const fmt = d=>d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
const BREEDS = ["Французский бульдог","Такса","Шотландская вислоухая","Беспородная","Другая"];
function examplePet(){ const t=today(); return {example:true,name:"Ася",species:"собака",breed:"Такса",birth:iso(addDays(t,-13*365-40)),clean:iso(addDays(t,-48)),vet:iso(addDays(t,-370)),abx:""}; }
function ageYears(p){ if(!p.birth) return null; return (today()-new Date(p.birth))/(365.25*864e5); }
function cleanInterval(p){ // Правила А и В
  const age=ageYears(p);
  if(age!==null && age>12) return [30,"возраст старше 12 лет: интервал сокращён до 1 месяца"];
  if(p.breed==="Французский бульдог"||p.breed==="Такса") return [60,`порода «${p.breed}» в группе риска: интервал 60 дней`];
  if(age!==null && age>5) return [60,"возраст старше 5 лет: интервал 60 дней"];
  return [90,"стандартный интервал 90 дней"];
}
function petAlerts(p){
  const t=today(), out=[]; const [ci,why]=cleanInterval(p);
  const breedGen = p.breed==="Такса"?"вашей таксы":p.breed==="Французский бульдог"?"вашего французского бульдога":`питомца ${p.name||""}`.trim();
  if(p.clean){ const due=addDays(new Date(p.clean),ci); const days=Math.round((t-new Date(p.clean))/864e5);
    out.push({kind:"clean", due, overdue:t>=due, text:`Привет! Прошло ${days} дн. с последней чистки зубов у ${breedGen}. Пора повторить процедуру, чтобы избежать накопления бактерий вроде <i>P. aeruginosa</i>. Записаться к ветеринару?`}); }
  else out.push({kind:"clean",due:t,overdue:true,text:`Отметьте дату последней чистки зубов, чтобы получать напоминания.`});
  const age=ageYears(p);
  if(age!==null && age>12) out.push({kind:"age",due:t,overdue:true,text:`Внимание: ${p.name||"вашему питомцу"} ${Math.floor(age)} лет. У 80% животных старше 5 лет есть болезни зубов. Рекомендуем чистить зубы раз в месяц и проверить дёсны.`});
  if(p.vet){ const due=addDays(new Date(p.vet),365); out.push({kind:"vet",due,overdue:t>=due,text:`Пора на ежегодный осмотр${p.name?" для "+p.name:""}. Последний визит: ${fmt(new Date(p.vet))}.`}); }
  if(p.abx){ out.push({kind:"abx",due:t,overdue:true,text:`Вы были у ветеринара ${fmt(new Date(p.abx))}. Врач назначил курс таблеток. Давайте антибиотик строго по схеме врача и после еды. Азитромицин может быть неэффективен против бактерий из пасти: уточните у врача результаты теста на чувствительность.`}); }
  return {list:out, ci, why};
}
ROUTES.pet = ()=>{
  let p = store.get("pet",null); if(!p) p=examplePet();
  const {list,ci,why} = petAlerts(p);
  const age=ageYears(p);
  view.innerHTML = `
  <h1>Дневник питомца</h1>
  ${p.example?alertBox("a","Это пример","Заполнен профиль-пример: такса 13 лет, как в исследовании. Измените поля, чтобы завести своего питомца."):""}
  <div class="card">
    <div class="grid2">
      <label class="field">Кличка<input id="pName" value="${esc(p.name||"")}"></label>
      <label class="field">Вид<select id="pSpecies">${["собака","кошка"].map(s=>`<option ${p.species===s?"selected":""}>${s}</option>`).join("")}</select></label>
    </div>
    <label class="field">Порода<select id="pBreed">${BREEDS.map(b=>`<option ${p.breed===b?"selected":""}>${b}</option>`).join("")}</select></label>
    <div class="grid2">
      <label class="field">Дата рождения<input type="date" id="pBirth" value="${p.birth||""}"></label>
      <label class="field">Последняя чистка зубов<input type="date" id="pClean" value="${p.clean||""}"></label>
    </div>
    <label class="field">Последний визит к ветеринару<input type="date" id="pVet" value="${p.vet||""}"></label>
    ${age!==null?`<p class="small muted">Возраст: <b class="mono">${age.toFixed(1)}</b> лет. Интервал чистки: <b class="mono">${ci}</b> дн. (${why}).</p>`:""}
  </div>
  <div class="grid2">
    <button class="btn" id="aClean">Почистил зубы</button>
    <button class="btn" id="aVet">Был у врача</button>
  </div>
  <button class="btn ghost" id="aAbx">Врач назначил антибиотик</button>
  <div class="card"><h2>Статус</h2>
    ${list.filter(x=>x.kind!=="age"&&x.kind!=="abx").map(x=>`<div class="status-row"><span>${x.kind==="clean"?"Чистка зубов":"Ежегодный осмотр"}<br><span class="small muted">следующая дата: ${fmt(x.due)}</span></span><span class="pill ${x.overdue?"r":"s"}">${x.overdue?"пора":"в порядке"}</span></div>`).join("")}
  </div>
  <span class="eyebrow">Уведомления</span>
  ${list.filter(x=>x.overdue).map(x=>`<div class="notif"><span class="ni"><svg width="18" height="18" style="color:var(--accent-ink)"><use href="#i-bell"/></svg></span><div><div class="nh"><b style="color:var(--ink)">PetBioScan</b><span>сейчас</span></div><p>${x.text}</p></div></div>`).join("") || `<p class="muted small">Новых напоминаний нет.</p>`}
  <p class="small muted">В прототипе напоминания показываются внутри приложения. В мобильной версии они приходят как push-уведомления.</p>
  ${DISCLAIMER}`;
  const save=()=>{ const np={name:$("#pName").value,species:$("#pSpecies").value,breed:$("#pBreed").value,birth:$("#pBirth").value,clean:$("#pClean").value,vet:$("#pVet").value,abx:p.abx||""}; store.set("pet",np); ROUTES.pet(); };
  ["#pName","#pSpecies","#pBreed","#pBirth","#pClean","#pVet"].forEach(s=>$(s).onchange=save);
  $("#aClean").onclick=()=>{ $("#pClean").value=iso(today()); save(); toast("Чистка зубов отмечена сегодня"); };
  $("#aVet").onclick=()=>{ $("#pVet").value=iso(today()); save(); toast("Визит к врачу отмечен сегодня"); };
  $("#aAbx").onclick=()=>{ p.abx=iso(today()); save(); toast("Напоминание о курсе добавлено"); };
};

render();
</script>
